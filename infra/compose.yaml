name: scene-tracker
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: [redis-server, --appendonly, 'yes']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  silo:
    image: ${SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    command: [server, /data, --console-address, ':9001']
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
  silo-init:
    image: ${SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329}
    depends_on:
      silo:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mcli alias set local http://silo:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mcli mb --ignore-existing "local/$${S3_BUCKET}"
        mcli anonymous set none "local/$${S3_BUCKET}"
    restart: 'no'
  migrate:
    profiles: [application]
    image: scene-tracker-backend:local
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    command: [alembic, upgrade, head]
    restart: 'no'
  api:
    profiles: [application]
    image: scene-tracker-backend:local
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    environment: &application-env
      S3_ENDPOINT: silo:9000
      PUBLIC_OBJECTSTORE_ENDPOINT: ${PUBLIC_OBJECTSTORE_ENDPOINT:-127.0.0.1:9000}
      YOLOE_CHECKPOINT: /models/checkpoints/yoloe-11s-seg-pf.pt
      VISION_DINOV2_CHECKPOINT: /models/checkpoints/dinov2_vits14_pretrain.pth
      VISION_DINOV2_SOURCE_DIR: /models/sources/dinov2
      MODEL_CACHE_DIR: /model-cache
      YOLOE_DEVICE: cpu
      VISION_DEVICE: cpu
    volumes: &application-volumes
      - ${SCENE_TRACKER_MODELS_DIR:-../models/real-inference}:/models:ro
      - model_cache:/model-cache
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    command: [uvicorn, scene_tracker.api.main:app, --host, 0.0.0.0, --port, '8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
  vision-worker:
    profiles: [application]
    image: scene-tracker-backend:local
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../.env
    environment: *application-env
    volumes: *application-volumes
    depends_on:
      api:
        condition: service_healthy
    command: [scene-tracker, worker, vision]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
