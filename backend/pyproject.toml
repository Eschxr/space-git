[project]
name = "scene-tracker"
version = "0.1.0"
description = "Review-driven fixed-camera semantic scene history"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "minio>=7.2,<8", "redis>=5,<7", "rq>=2,<3", "python-multipart>=0.0.18,<1", "pillow>=11,<13"]

[project.scripts]
scene-tracker = "scene_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
vision = [] # Real ML dependencies are added with adapters in Phase 4.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires external services"]
