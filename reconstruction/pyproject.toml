[project]
name = "reconstruction-worker"
version = "0.1.0"
description = "Isolated per-view reconstruction worker scaffold"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
reconstruction-worker = "reconstruction_worker.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external services"]
